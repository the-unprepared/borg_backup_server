# SSH-Konfiguration für den Borg Backup Server
# Wird über "Include /etc/ssh/sshd_config.d/*.conf" geladen und hat damit Vorrang vor sshd_config.

# Host-Keys (werden von startup.sh dauerhaft im Volume gespeichert)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# Nur borguser mit Public Key
PermitRootLogin no
AllowUsers borguser
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# authorized_keys liegt außerhalb des Volumes, gehört root und wird bei jedem Start neu erzeugt
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

# Nicht benötigte Funktionen abschalten
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no

# Abgebrochene Verbindungen erkennen, damit Repository-Locks freigegeben werden
ClientAliveInterval 60
ClientAliveCountMax 5
