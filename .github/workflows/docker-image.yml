name: Docker Image

on:
  # Neu bauen am 1. und 15. jedes Monats (Zeit in UTC), damit Alpine- und Borg-Updates im Image landen
  schedule:
    - cron: '17 3 1,15 * *'
  # Bei Änderungen am Image sofort bauen
  push:
    branches: [main]
    paths:
      - Dockerfile
      - startup.sh
      - borg-prune.sh
      - sshd_borg.conf
      - .github/workflows/docker-image.yml
  # Manuell über "Actions" -> "Run workflow"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulation für den arm64-Build (z. B. für ARM-NAS)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Immer frisches Basis-Image und aktuelle Pakete
          pull: true
          no-cache: true
          push: true
          tags: unprepared/borg_backup_server:latest

  # GitHub deaktiviert geplante Workflows nach 60 Tagen ohne Aktivität im Repository.
  # Das erneute Aktivieren über die API setzt diese Frist zurück, ohne Dummy-Commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/docker-image.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
